<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Outline Generator</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f6f7fb; color: #182034; }
    main { max-width: 720px; margin: 10vh auto; padding: 48px; background: white; border-radius: 18px; box-shadow: 0 14px 40px #18203418; }
    h1 { font-size: clamp(2rem, 6vw, 3.8rem); line-height: 1.05; margin: 0 0 20px; }
    p { font-size: 1.2rem; line-height: 1.65; color: #4d5870; }
    .tag { display: inline-block; padding: .4rem .75rem; border-radius: 99px; background: #e7efff; color: #2450a4; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Project planning</span>
    <h1>Project Outline Generator</h1>
    <p>Turn an idea into a clear, practical project outline. More tools and guidance are coming soon.</p>
  </main>
</body>
</html>
